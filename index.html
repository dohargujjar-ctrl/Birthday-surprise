<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  font-family:Georgia,serif;
  color:#5b1833;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.55),transparent 25%),
    radial-gradient(circle at 80% 80%,rgba(255,255,255,.35),transparent 30%),
    linear-gradient(135deg,#ffdce5,#f5a7b8,#ffd6df);
  overflow:hidden;
}

.page{
  display:none;
  width:100%;
  height:100vh;
  padding:18px;
  align-items:center;
  justify-content:center;
}

.page.active{
  display:flex;
}

.card{
  width:min(94vw,680px);
  max-height:92vh;
  overflow-y:auto;
  padding:30px 24px;
  text-align:center;
  border-radius:30px;
  background:rgba(255,255,255,.90);
  box-shadow:0 18px 55px rgba(100,20,50,.25);
  animation:enter .7s ease;
}

.card::-webkit-scrollbar{
  width:5px;
}

.card::-webkit-scrollbar-thumb{
  background:#e889a5;
  border-radius:10px;
}

h1{
  color:#d6336c;
  font-size:30px;
  margin:5px 0 20px;
}

h2{
  color:#c2255c;
}

p{
  font-size:18px;
  line-height:1.8;
}

.letter{
  text-align:left;
}

.letter h1{
  text-align:center;
}

button{
  border:none;
  outline:none;
  padding:14px 25px;
  border-radius:30px;
  background:linear-gradient(135deg,#d6336c,#e85d87);
  color:#fff;
  font-size:17px;
  font-family:Georgia,serif;
  box-shadow:0 8px 20px rgba(214,51,108,.30);
  cursor:pointer;
}
