<script>

let currentPage = 1;
let musicStarted = false;

function startMusic(){

  const music = document.getElementById("bgMusic");

  if(musicStarted) return;

  musicStarted = true;
  music.volume = 0.6;

  // Pehle audio ko load/play hone do
  music.play().then(() => {

    // Playback start hote hi 16 seconds par jump
    music.currentTime = 16;

  }).catch(() => {

    // Agar browser ne pehli baar play block kiya
    musicStarted = false;

  });
}

function nextPage(){

  startMusic();

  document.getElementById("page" + currentPage)
    .classList.remove("active");

  currentPage++;

  document.getElementById("page" + currentPage)
    .classList.add("active");

  window.scrollTo(0,0);
}

function finalSurprise(){

  startMusic();

  document.getElementById("page" + currentPage)
    .classList.remove("active");

  currentPage++;

  document.getElementById("page" + currentPage)
    .classList.add("active");

  createHearts();
  createConfetti();
}

function createHearts(){

  for(let i=0;i<25;i++){

    let heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML=[
      "❤️","💗","💕","💖","💘"
    ][Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"vw";

    heart.style.animationDelay=
      Math.random()*4+"s";

    heart.style.fontSize=
      (15+Math.random()*20)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },7000);
  }
}

function createConfetti(){

  const box=document.getElementById("confetti");

  for(let i=0;i<80;i++){

    let piece=document.createElement("div");

    piece.innerHTML="❤️";

    piece.style.position="absolute";
    piece.style.left=Math.random()*100+"vw";
    piece.style.top="-30px";

    piece.style.fontSize=
      (10+Math.random()*20)+"px";

    piece.style.animation=
      "fall "+(2+Math.random()*3)+"s linear forwards";

    piece.style.animationDelay=
      Math.random()*1+"s";

    box.appendChild(piece);

    setTimeout(()=>{
      piece.remove();
    },5000);
  }
}

const style=document.createElement("style");

style.innerHTML=`
@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}`;

document.head.appendChild(style);

createHearts();

</script>
